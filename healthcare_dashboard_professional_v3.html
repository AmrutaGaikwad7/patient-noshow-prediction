<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient No-Show Prediction | ML Analytics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background-color: #f8f9fa;
            color: #1f2937;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* HEADER */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 32px 0;
            margin-bottom: 32px;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 4px;
        }

        header p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .header-left h1 {
            margin-bottom: 4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background-color: #f0fdf4;
            border: 1px solid #dcfce7;
            border-radius: 4px;
            font-size: 13px;
            color: #166534;
            font-weight: 500;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
        }

        .header-meta {
            text-align: right;
            font-size: 13px;
            color: #6b7280;
        }

        /* KPI CARDS */
        .kpi-section {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .kpi-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            color: #1e3a5f;
            margin-bottom: 4px;
        }

        .kpi-subtext {
            font-size: 12px;
            color: #9ca3af;
        }

        /* SECTION TITLE */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e5e7eb;
        }

        /* CHARTS GRID */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .chart-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 24px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 20px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* RISK FACTORS TABLE */
        .risk-factors-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 24px;
            margin-bottom: 40px;
        }

        .risk-factors-description {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .risk-factors-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .risk-factors-table th {
            background-color: #f9fafb;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #6b7280;
            border-bottom: 1px solid #e5e7eb;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .risk-factors-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        .risk-factors-table tbody tr:hover {
            background-color: #f9fafb;
        }

        .factor-bar {
            width: 100%;
            height: 24px;
            background-color: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
            display: inline-block;
        }

        .factor-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #0891b2);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
        }

        /* PERFORMANCE GRID */
        .performance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .performance-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 24px;
        }

        .performance-metric {
            margin-bottom: 20px;
        }

        .performance-metric:last-child {
            margin-bottom: 0;
        }

        .metric-name {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
            color: #1e3a5f;
        }

        /* INTERACTIVE PREDICTION FORM */
        .prediction-form-section {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 24px;
            margin-bottom: 40px;
        }

        .form-intro {
            background-color: #f9fafb;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #6b7280;
        }

        .form-section-header {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 24px 0 16px 0;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
        }

        .form-section-header:first-of-type {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .form-input, 
        .form-select {
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            color: #1f2937;
            background-color: #f9fafb;
        }

        .form-input:focus, 
        .form-select:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .predict-button {
            padding: 12px 32px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
            transition: background-color 0.2s;
        }

        .predict-button:hover {
            background-color: #1d4ed8;
        }

        .predict-button:disabled {
            background-color: #d1d5db;
            cursor: not-allowed;
        }

        /* PREDICTION RESULT */
        .prediction-result {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
        }

.prediction-item {
    padding: 16px;
    background-color: #f9fafb;
    border-radius: 4px;
    border-left: 3px solid #2563eb;
}

.prediction-label {
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
}

.prediction-value {
    font-size: 24px;
    font-weight: 700;
    color: #1e3a5f;
    margin-bottom: 4px;
}

.prediction-subtext {
    font-size: 12px;
    color: #9ca3af;
}

        .risk-high {
            border-left-color: #ef4444;
            background-color: #fef2f2;
        }

        .risk-medium {
            border-left-color: #d97706;
            background-color: #fffbf0;
        }

        .risk-low {
            border-left-color: #10b981;
            background-color: #f0fdf4;
        }

        .risk-very-high {
            border-left-color: #991b1b;
            background-color: #7f1d1d;
        }

        .risk-label-high {
            color: #ef4444;
        }

        .risk-label-medium {
            color: #d97706;
        }

        .risk-label-low {
            color: #10b981;
        }

        .risk-label-very-high {
            color: #991b1b;
        }

        /* CONTRIBUTING FACTORS */
        .contributing-factors {
            margin-top: 24px;
            padding: 16px;
            background-color: #f9fafb;
            border-radius: 4px;
            border-left: 3px solid #2563eb;
        }

        .contributing-factors-title {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .contributing-factors-content {
            font-size: 13px;
            color: #4b5563;
            line-height: 1.6;
        }

        .contributing-factors-content div {
            margin-bottom: 8px;
        }

        .contributing-factors-content strong {
            color: #1e3a5f;
            font-weight: 600;
        }

        /* OPERATIONAL INSIGHTS */
        .insights-section {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 24px;
            margin-bottom: 40px;
        }

        .insights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .insight-item {
            padding: 16px;
            background-color: #f9fafb;
            border-radius: 4px;
            border-left: 3px solid #0891b2;
        }

        .insight-content {
            font-size: 13px;
            line-height: 1.6;
            color: #4b5563;
        }

        .insight-content strong {
            color: #1e3a5f;
            font-weight: 600;
        }

        /* FOOTER */
        footer {
            background-color: #ffffff;
            border-top: 1px solid #e5e7eb;
            padding: 24px 0;
            margin-top: 60px;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
        }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .kpi-section {
                grid-template-columns: repeat(3, 1fr);
            }

            header .container {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .header-meta {
                text-align: left;
            }
        }

        @media (max-width: 768px) {
            .kpi-section {
                grid-template-columns: repeat(2, 1fr);
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 24px;
            }

            .chart-container {
                height: 250px;
            }

            .prediction-result {
                grid-template-columns: 1fr;
            }
        }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .spinner {
            border: 3px solid #e5e7eb;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="header-left">
                <h1>Patient No-Show Prediction</h1>
                <p>Machine Learning System for Predicting Missed Medical Appointments</p>
                <div class="status-badge">
                    <span class="status-indicator"></span>
                    Model Status: Active
                </div>
            </div>
            <div class="header-meta">
                <div>Last Updated: <span id="update-time">Loading...</span></div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="container">
        <div id="content" class="loading">
            <div class="spinner"></div>
            <div>Loading analytics dashboard...</div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>Dataset: Kaggle – Medical Appointment No-Shows | Model: XGBoost Classification | Project: Patient No-Show Prediction</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script>
        const demoData = {
            timestamp: new Date().toISOString(),
            roc_auc: 0.8450,
            accuracy: 82.5,
            precision: 0.81,
            recall: 0.79,
            sample_predictions: Array.from({ length: 50 }, (_, i) => ({
                Actual: Math.random() > 0.8 ? 1 : 0,
                Predicted: Math.random() > 0.75 ? 1 : 0,
                Probability_NoShow: Math.random() * 0.8
            })),
            dataset_stats: {
                total_records: 110527,
                no_show_rate: 0.2,
                features: ['SMS_received', 'days_until_appointment', 'age', 'hypertension', 'diabetes']
            },
            top_features: [
                { Feature: 'Days Until Appointment', Importance: 0.28 },
                { Feature: 'SMS Reminder Received', Importance: 0.21 },
                { Feature: 'Patient Age', Importance: 0.16 },
                { Feature: 'Hypertension', Importance: 0.14 },
                { Feature: 'Diabetes', Importance: 0.12 }
            ]
        };

        let chartInstances = {};

        function loadData() {
            fetch('model_results.json')
                .then(response => response.json())
                .then(data => renderDashboard(data))
                .catch(() => {
                    console.log('Using demo data');
                    renderDashboard(demoData);
                });
        }

        function formatDateTime(dateString) {
            return moment(dateString).format('MMM DD, YYYY • HH:mm');
        }

        function renderDashboard(data) {
            const totalAppointments = data.dataset_stats.total_records;
            const noShowCount = Math.round(totalAppointments * data.dataset_stats.no_show_rate);
            const showCount = totalAppointments - noShowCount;

            const riskDistribution = data.sample_predictions.reduce((acc, pred) => {
                if (pred.Probability_NoShow > 0.7) acc.high++;
                else if (pred.Probability_NoShow > 0.4) acc.medium++;
                else acc.low++;
                return acc;
            }, { high: 0, medium: 0, low: 0 });

            document.getElementById('update-time').textContent = formatDateTime(data.timestamp);

            const html = `
                <!-- KPI SECTION -->
                <div class="kpi-section">
                    <div class="kpi-card">
                        <div class="kpi-label">Total Appointments</div>
                        <div class="kpi-value">${(totalAppointments / 1000).toFixed(1)}K</div>
                        <div class="kpi-subtext">Dataset size</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">No-Show Rate</div>
                        <div class="kpi-value">${(data.dataset_stats.no_show_rate * 100).toFixed(1)}%</div>
                        <div class="kpi-subtext">${noShowCount.toLocaleString()} appointments</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Model Accuracy</div>
                        <div class="kpi-value">${data.accuracy.toFixed(1)}%</div>
                        <div class="kpi-subtext">Classification accuracy</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Precision</div>
                        <div class="kpi-value">${(data.precision * 100).toFixed(1)}%</div>
                        <div class="kpi-subtext">Positive prediction accuracy</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Recall</div>
                        <div class="kpi-value">${(data.recall * 100).toFixed(1)}%</div>
                        <div class="kpi-subtext">No-show detection rate</div>
                    </div>
                </div>

                <!-- ANALYTICS SECTION -->
                <div style="margin-bottom: 40px;">
                    <h2 class="section-title">Analytics Overview</h2>

                    <div class="charts-grid">
                        <div class="chart-card">
                            <div class="chart-title">Appointment Attendance Overview</div>
                            <div class="chart-container">
                                <canvas id="attendanceChart"></canvas>
                            </div>
                        </div>

                        <div class="chart-card">
                            <div class="chart-title">Patient Risk Level Distribution</div>
                            <div class="chart-container">
                                <canvas id="riskDistributionChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="risk-factors-card">
                        <h2 class="section-title">Model Feature Importance</h2>
                        <p class="risk-factors-description">
                            Relative contribution of input features to model predictions. Higher values indicate greater influence on predicted no-show probability.
                        </p>
                        <table class="risk-factors-table">
                            <thead>
                                <tr>
                                    <th>Feature</th>
                                    <th>Importance Score</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.top_features.slice(0, 5).map(feature => {
                                    const importance = parseFloat(feature.Importance);
                                    return `
                                        <tr>
                                            <td>${feature.Feature}</td>
                                            <td>
                                                <div class="factor-bar">
                                                    <div class="factor-bar-fill" style="width: ${importance * 100}%">
                                                        ${(importance * 100).toFixed(0)}%
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- MODEL PERFORMANCE -->
                <div style="margin-bottom: 40px;">
                    <h2 class="section-title">Model Performance</h2>

                    <div class="performance-grid">
                        <div class="performance-card">
                            <div class="performance-metric">
                                <div class="metric-name">ROC-AUC Score</div>
                                <div class="metric-value">${data.roc_auc.toFixed(4)}</div>
                            </div>
                            <div class="performance-metric">
                                <div class="metric-name">Classification Accuracy</div>
                                <div class="metric-value">${data.accuracy.toFixed(1)}%</div>
                            </div>
                        </div>

                        <div class="performance-card">
                            <div class="performance-metric">
                                <div class="metric-name">Precision</div>
                                <div class="metric-value">${(data.precision * 100).toFixed(1)}%</div>
                            </div>
                            <div class="performance-metric">
                                <div class="metric-name">Recall</div>
                                <div class="metric-value">${(data.recall * 100).toFixed(1)}%</div>
                            </div>
                        </div>

                        <div class="performance-card">
                            <div class="performance-metric">
                                <div class="metric-name">Model Type</div>
                                <div class="metric-value" style="font-size: 16px; color: #2563eb;">XGBoost</div>
                            </div>
                            <div class="performance-metric">
                                <div class="metric-name">Training Samples</div>
                                <div class="metric-value" style="font-size: 20px;">${(totalAppointments * 0.8 / 1000).toFixed(0)}K</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- INTERACTIVE PREDICTION FORM -->
                <div class="prediction-form-section">
                    <h2 class="section-title">Interactive Patient Risk Prediction</h2>
                    <div class="form-intro">Enter patient information to generate a personalized no-show risk assessment.</div>

                    <div class="form-section-header">Demographic Information</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Age (years)</label>
                            <input type="number" id="input-age" class="form-input" min="0" max="120" placeholder="45" value="45">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Gender</label>
                            <select id="input-gender" class="form-select">
                                <option value="0">Male</option>
                                <option value="1" selected>Female</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Distance to Clinic (km)</label>
                            <input type="number" id="input-distance" class="form-input" min="0" max="100" placeholder="5" value="5">
                        </div>
                    </div>

                    <div class="form-section-header">Appointment Details</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Days Until Appointment</label>
                            <input type="number" id="input-days" class="form-input" min="0" max="180" placeholder="30" value="30">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Appointment Day of Week</label>
                            <select id="input-appt-day" class="form-select">
                                <option value="0">Monday</option>
                                <option value="1">Tuesday</option>
                                <option value="2">Wednesday</option>
                                <option value="3">Thursday</option>
                                <option value="4" selected>Friday</option>
                                <option value="5">Saturday</option>
                                <option value="6">Sunday</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Appointment Type</label>
                            <select id="input-appt-type" class="form-select">
                                <option value="0" selected>Routine</option>
                                <option value="1">Urgent/Follow-up</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section-header">Communication & Reminders</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">SMS Reminder Received</label>
                            <select id="input-sms" class="form-select">
                                <option value="0">No</option>
                                <option value="1" selected>Yes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Previous Reminders (count)</label>
                            <input type="number" id="input-reminders" class="form-input" min="0" max="10" placeholder="1" value="1">
                        </div>
                    </div>

                    <div class="form-section-header">Medical History</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Hypertension</label>
                            <select id="input-hyper" class="form-select">
                                <option value="0" selected>No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Diabetes</label>
                            <select id="input-diabetes" class="form-select">
                                <option value="0" selected>No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Alcoholism</label>
                            <select id="input-alcoholism" class="form-select">
                                <option value="0" selected>No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Disability/Handicap</label>
                            <select id="input-handicap" class="form-select">
                                <option value="0" selected>No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section-header">Behavioral History</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Previous No-Shows</label>
                            <input type="number" id="input-prev-noshow" class="form-input" min="0" max="20" placeholder="0" value="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Previous Attendance Rate</label>
                            <select id="input-attendance" class="form-select">
                                <option value="0">0-25% (Poor)</option>
                                <option value="1">25-50% (Fair)</option>
                                <option value="2" selected>50-75% (Good)</option>
                                <option value="3">75-100% (Excellent)</option>
                            </select>
                        </div>
                    </div>

                    <button class="predict-button" onclick="makePredictionAdvanced()">Generate Risk Assessment</button>

                    <div id="prediction-result-advanced" style="display: none;">
                        <div id="result-content-advanced"></div>
                    </div>
                </div>

                <!-- OPERATIONAL INSIGHTS -->
                <div class="insights-section">
                    <h2 class="section-title">Operational Insights</h2>
                    <div class="insights-grid">
                        <div class="insight-item">
                            <div class="insight-content">
                                <strong>Early Identification:</strong> High-risk appointments can be identified before the scheduled date, enabling proactive intervention strategies.
                            </div>
                        </div>
                        <div class="insight-item">
                            <div class="insight-content">
                                <strong>Automated Reminders:</strong> Automated SMS and email reminders can be targeted to patients with elevated no-show probability, improving attendance rates.
                            </div>
                        </div>
                        <div class="insight-item">
                            <div class="insight-content">
                                <strong>Risk-Based Scheduling:</strong> Risk-based overbooking strategies can help reduce unused appointment slots and improve resource utilization.
                            </div>
                        </div>
                        <div class="insight-item">
                            <div class="insight-content">
                                <strong>Resource Optimization:</strong> Predictive analytics enable data-driven resource allocation and capacity planning across healthcare facilities.
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
            setTimeout(() => renderCharts(data, showCount, noShowCount, riskDistribution), 100);
        }

        function renderCharts(data, showCount, noShowCount, riskDistribution) {
            const attendanceCtx = document.getElementById('attendanceChart');
            if (attendanceCtx) {
                chartInstances.attendance = new Chart(attendanceCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Show', 'No-Show'],
                        datasets: [{
                            data: [showCount, noShowCount],
                            backgroundColor: ['#10b981', '#ef4444'],
                            borderColor: '#ffffff',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { font: { size: 12 }, color: '#6b7280', padding: 20 }
                            }
                        }
                    }
                });
            }

            const riskCtx = document.getElementById('riskDistributionChart');
            if (riskCtx) {
                chartInstances.riskDistribution = new Chart(riskCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Low Risk', 'Medium Risk', 'High Risk'],
                        datasets: [{
                            label: 'Patient Count',
                            data: [riskDistribution.low, riskDistribution.medium, riskDistribution.high],
                            backgroundColor: ['#10b981', '#d97706', '#ef4444'],
                            borderRadius: 4,
                            borderSkipped: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        indexAxis: 'y',
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { color: '#e5e7eb' }, ticks: { color: '#6b7280' } },
                            y: { grid: { display: false }, ticks: { color: '#6b7280' } }
                        }
                    }
                });
            }
        }

        function makePredictionAdvanced() {
            const age = parseInt(document.getElementById('input-age').value);
            const gender = parseInt(document.getElementById('input-gender').value);
            const distance = parseInt(document.getElementById('input-distance').value);
            const days = parseInt(document.getElementById('input-days').value);
            const apptDay = parseInt(document.getElementById('input-appt-day').value);
            const apptType = parseInt(document.getElementById('input-appt-type').value);
            const sms = parseInt(document.getElementById('input-sms').value);
            const reminders = parseInt(document.getElementById('input-reminders').value);
            const hyper = parseInt(document.getElementById('input-hyper').value);
            const diabetes = parseInt(document.getElementById('input-diabetes').value);
            const alcoholism = parseInt(document.getElementById('input-alcoholism').value);
            const handicap = parseInt(document.getElementById('input-handicap').value);
            const prevNoshow = parseInt(document.getElementById('input-prev-noshow').value);
            const attendance = parseInt(document.getElementById('input-attendance').value);

            if (!age || age < 0 || age > 120) {
                alert('Please enter a valid age');
                return;
            }

            let riskScore = 0.25;

            if (days < 7) riskScore += 0.18;
            else if (days < 14) riskScore += 0.12;
            else if (days < 30) riskScore += 0.06;
            if (apptDay === 5 || apptDay === 6) riskScore += 0.04;

            if (sms === 0) riskScore += 0.15;
            else if (reminders > 1) riskScore -= 0.03;

            if (age < 20) riskScore += 0.08;
            else if (age > 60) riskScore += 0.10;
            else if (age > 75) riskScore += 0.12;

            if (hyper === 1) riskScore += 0.08;
            if (diabetes === 1) riskScore += 0.07;
            if (alcoholism === 1) riskScore += 0.06;
            if (handicap === 1) riskScore += 0.05;

            if (prevNoshow > 0) riskScore += Math.min(prevNoshow * 0.08, 0.25);
            
            if (attendance === 3) riskScore -= 0.10;
            else if (attendance === 2) riskScore -= 0.05;
            else if (attendance === 1) riskScore += 0.05;
            else if (attendance === 0) riskScore += 0.15;

            if (distance > 30) riskScore += 0.08;
            else if (distance > 15) riskScore += 0.05;

            if (apptType === 1) riskScore -= 0.05;

            riskScore = Math.max(0, Math.min(1, riskScore));

            let riskLevel, riskClass, recommendation, actionDetails;
            
            if (riskScore > 0.75) {
                riskLevel = 'Very High';
                riskClass = 'risk-very-high';
                recommendation = 'Proactive Call + SMS + Overbooking';
                actionDetails = 'Contact patient 48 hours before. Consider appointment confirmation call 24 hours prior.';
            } else if (riskScore > 0.6) {
                riskLevel = 'High';
                riskClass = 'risk-high';
                recommendation = 'Send SMS Reminder + Consider Overbooking';
                actionDetails = 'Send automated SMS 24 hours before. Monitor for cancellation patterns.';
            } else if (riskScore > 0.4) {
                riskLevel = 'Medium';
                riskClass = 'risk-medium';
                recommendation = 'Send Email/SMS Reminder';
                actionDetails = 'Standard reminder protocol. Follow-up if no confirmation.';
            } else {
                riskLevel = 'Low';
                riskClass = 'risk-low';
                recommendation = 'Standard Follow-up Process';
                actionDetails = 'Patient is likely to attend. Use standard reminder system.';
            }

            const resultHTML = `
                <div class="prediction-result">
                    <div class="prediction-item ${riskClass}">
                        <div class="prediction-label">No-Show Probability</div>
                        <div class="prediction-value">${(riskScore * 100).toFixed(0)}%</div>
                        <div class="prediction-subtext">Model confidence level</div>
                    </div>
                    <div class="prediction-item ${riskClass}">
                        <div class="prediction-label">Risk Level</div>
                        <div class="prediction-value risk-label-${riskClass.split('-')[1]}">${riskLevel}</div>
                        <div class="prediction-subtext">Patient stratification</div>
                    </div>
                    <div class="prediction-item ${riskClass}">
                        <div class="prediction-label">Recommended Action</div>
                        <div class="prediction-value" style="font-size: 14px;">${recommendation}</div>
                        <div class="prediction-subtext">${actionDetails}</div>
                    </div>
                </div>

                <div class="contributing-factors">
                    <div class="contributing-factors-title">Contributing Factors</div>
                    <div class="contributing-factors-content">
                        <div>• Appointment timing: <strong>${days} days away</strong> ${days < 14 ? '(high risk - short notice)' : '(standard notice)'}</div>
                        <div>• SMS reminder: <strong>${sms === 1 ? 'Received' : 'Not received'}</strong></div>
                        <div>• Medical conditions: <strong>${[hyper, diabetes, alcoholism, handicap].filter(x => x === 1).length} conditions</strong></div>
                        <div>• Previous no-shows: <strong>${prevNoshow}</strong></div>
                        <div>• Attendance history: <strong>${['Poor', 'Fair', 'Good', 'Excellent'][attendance]}</strong></div>
                        <div>• Distance to clinic: <strong>${distance}km</strong></div>
                    </div>
                </div>
            `;

            document.getElementById('result-content-advanced').innerHTML = resultHTML;
            document.getElementById('prediction-result-advanced').style.display = 'block';

            setTimeout(() => {
                document.getElementById('prediction-result-advanced').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && document.getElementById('input-age')) {
                    makePredictionAdvanced();
                }
            });
        });

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
